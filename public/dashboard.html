<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — DeadlineOwl</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0d0d0d;--white:#ffffff;--off:#f8f7f4;--border:#e5e3de;--text:#1c1c1a;--muted:#6b6b62;--light:#9a9a90;--gold:#b8973a;--gold-light:#fdf8ec;--green:#1a6b3a;--green-light:#f0f7f3;--amber:#92600a;--amber-light:#fffbeb;--red:#8b1a1a;--red-light:#fef2f2;--serif:'Playfair Display',Georgia,serif;--sans:'Source Sans 3',system-ui,sans-serif}
body{font-family:var(--sans);background:var(--off);color:var(--text);min-height:100vh}
.layout{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:260px;min-width:260px;background:var(--black);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10}
.sidebar-logo{font-family:var(--serif);font-size:1.3rem;color:var(--white);padding:1.75rem 1.5rem;border-bottom:1px solid rgba(255,255,255,0.08);text-decoration:none;display:block}
.sidebar-nav{flex:1;padding:1rem 0}
.nav-label{font-size:0.65rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.25);padding:1rem 1.5rem 0.5rem}
.nav-item{display:flex;align-items:center;gap:10px;padding:0.7rem 1.5rem;color:rgba(255,255,255,0.55);font-size:0.875rem;cursor:pointer;transition:all 0.15s;text-decoration:none;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.05);color:var(--white)}
.nav-item.active{background:rgba(184,151,58,0.1);color:var(--gold);border-left-color:var(--gold)}
.sidebar-footer{padding:1.5rem;border-top:1px solid rgba(255,255,255,0.08)}
.user-email{font-size:0.78rem;color:rgba(255,255,255,0.4);margin-bottom:0.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-pill{display:inline-block;padding:0.2rem 0.625rem;background:rgba(184,151,58,0.15);border:1px solid rgba(184,151,58,0.3);font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:0.875rem}
.logout-btn{background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.4);font-family:var(--sans);font-size:0.78rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:0.5rem 1rem;cursor:pointer;width:100%;transition:all 0.15s}
.logout-btn:hover{border-color:rgba(255,255,255,0.25);color:var(--white)}

/* MAIN */
.main{margin-left:260px;flex:1;padding:0}

/* TOP BAR */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between}
.page-title{font-family:var(--serif);font-size:1.5rem;font-weight:400}
.topbar-actions{display:flex;gap:0.75rem}

/* CONTENT */
.content{padding:2rem}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:2rem}
.stat-card{background:var(--white);border:1px solid var(--border);padding:1.25rem}
.stat-label{font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--light);margin-bottom:0.5rem}
.stat-val{font-family:var(--serif);font-size:2rem;font-weight:400;color:var(--text)}
.stat-val.red{color:var(--red)}
.stat-val.amber{color:var(--amber)}
.stat-val.green{color:var(--green)}
.stat-val.gold{color:var(--gold)}

/* ADD FORM */
.add-form{background:var(--white);border:1px solid var(--border);padding:1.75rem;margin-bottom:2rem}
.form-title{font-family:var(--serif);font-size:1.1rem;font-weight:400;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:1.25rem}
.form-field label{display:block;font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem}
.form-field input,.form-field select{width:100%;padding:0.7rem 0.875rem;background:var(--off);border:1px solid var(--border);font-family:var(--sans);font-size:0.875rem;color:var(--text);outline:none;transition:border-color 0.2s}
.form-field input:focus,.form-field select:focus{border-color:var(--gold)}
.form-field select option{background:var(--white)}
.form-field input::placeholder{color:var(--light)}
.alert-checks{display:flex;gap:1.5rem;align-items:center}
.alert-check{display:flex;align-items:center;gap:6px;font-size:0.82rem;color:var(--muted);cursor:pointer}
.alert-check input{width:auto;cursor:pointer;accent-color:var(--gold)}
.add-btn{padding:0.7rem 1.75rem;background:var(--black);color:var(--white);font-family:var(--sans);font-size:0.78rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;border:none;cursor:pointer;transition:background 0.2s}
.add-btn:hover{background:#333}
.add-btn:disabled{opacity:0.5;cursor:not-allowed}

/* SECTION HEADER */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.section-title{font-family:var(--serif);font-size:1rem;font-weight:400}
.filter-tabs{display:flex;gap:0;border:1px solid var(--border)}
.filter-tab{padding:0.4rem 0.875rem;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border:none;background:var(--white);color:var(--muted);font-family:var(--sans);transition:all 0.15s;border-right:1px solid var(--border)}
.filter-tab:last-child{border-right:none}
.filter-tab:hover{background:var(--off)}
.filter-tab.active{background:var(--black);color:var(--white)}

/* DEADLINE CARDS */
.deadline-card{background:var(--white);border:1px solid var(--border);padding:1.25rem 1.5rem;margin-bottom:0.625rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;transition:border-color 0.15s}
.deadline-card:hover{border-color:#c8c6c0}
.deadline-card.urgent{border-left:3px solid var(--red)}
.deadline-card.warning{border-left:3px solid var(--amber)}
.deadline-card.completed{opacity:0.55}
.dl-left{flex:1;min-width:0}
.dl-title{font-size:0.95rem;font-weight:600;color:var(--text);margin-bottom:3px}
.dl-meta{font-size:0.78rem;color:var(--light)}
.dl-right{display:flex;align-items:center;gap:0.875rem;flex-shrink:0}
.days-badge{padding:0.25rem 0.75rem;font-size:0.72rem;font-weight:600;letter-spacing:0.04em;white-space:nowrap}
.days-badge.red{background:var(--red-light);color:var(--red)}
.days-badge.amber{background:var(--amber-light);color:var(--amber)}
.days-badge.gold{background:var(--gold-light);color:var(--gold)}
.days-badge.green{background:var(--green-light);color:var(--green)}
.days-badge.gray{background:var(--off);color:var(--muted)}
.action-btn{padding:0.35rem 0.875rem;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--muted);font-family:var(--sans);transition:all 0.15s}
.action-btn:hover{border-color:#c8c6c0;color:var(--text)}
.action-btn.success:hover{background:var(--green-light);border-color:#bbf7d0;color:var(--green)}
.action-btn.danger:hover{background:var(--red-light);border-color:#fecaca;color:var(--red)}

.empty{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-icon{font-family:var(--serif);font-size:3rem;color:var(--border);margin-bottom:1rem;font-style:italic}
.empty h3{font-family:var(--serif);font-size:1.25rem;font-weight:400;color:var(--muted);margin-bottom:0.5rem}
.empty p{font-size:0.875rem;color:var(--light)}
.loading{text-align:center;padding:3rem;color:var(--light);font-size:0.875rem;letter-spacing:0.04em;text-transform:uppercase}

.toast{position:fixed;bottom:2rem;right:2rem;background:var(--black);color:var(--white);padding:0.875rem 1.25rem;font-size:0.82rem;display:none;z-index:999;max-width:320px;border-left:3px solid var(--gold)}
.toast.show{display:block}
.toast.error{border-left-color:var(--red)}

@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.stats-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.form-grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <a href="/" class="sidebar-logo">DeadlineOwl</a>
  <nav class="sidebar-nav">
    <div class="nav-label">Deadlines</div>
    <button class="nav-item active" onclick="showSection('deadlines')">📅 &nbsp;Upcoming</button>
    <button class="nav-item" onclick="showSection('completed')">✓ &nbsp;Completed</button>
    <button class="nav-item" onclick="showSection('missed')">⚠ &nbsp;Missed</button>
    <div class="nav-label" style="margin-top:0.5rem">Account</div>
    <a class="nav-item" href="/#pricing">⚡ &nbsp;Upgrade Plan</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-email" id="userEmail">Loading...</div>
    <div class="plan-pill" id="userPlan">Free</div>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
</aside>

<main class="main">
  <!-- DEADLINES -->
  <div id="section-deadlines">
    <div class="topbar">
      <h1 class="page-title">Your Deadlines</h1>
    </div>
    <div class="content">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-val gold" id="stat-total">—</div></div>
        <div class="stat-card"><div class="stat-label">Due in 7 days</div><div class="stat-val red" id="stat-soon">—</div></div>
        <div class="stat-card"><div class="stat-label">This month</div><div class="stat-val amber" id="stat-month">—</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-val green" id="stat-done">—</div></div>
        <div class="stat-card"><div class="stat-label">Missed</div><div class="stat-val red" id="stat-missed">—</div></div>
      </div>

      <div class="add-form">
        <h2 class="form-title">Add New Deadline</h2>
        <div class="form-grid">
          <div class="form-field">
            <label>Deadline title *</label>
            <input type="text" id="newTitle" placeholder="e.g. Q2 VAT Return Filing">
          </div>
          <div class="form-field">
            <label>Due date *</label>
            <input type="date" id="newDate">
          </div>
          <div class="form-field">
            <label>Category</label>
            <select id="newCategory">
              <option value="tax">Tax</option>
              <option value="privacy">Privacy / GDPR</option>
              <option value="financial">Financial</option>
              <option value="legal">Legal</option>
              <option value="security">Security</option>
              <option value="environmental">Environmental</option>
              <option value="labor">Labor / HR</option>
              <option value="license">License / Permit</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-grid2">
          <div class="form-field">
            <label>Jurisdiction</label>
            <input type="text" id="newJurisdiction" placeholder="e.g. United Kingdom, EU">
          </div>
          <div class="form-field">
            <label>Notes (optional)</label>
            <input type="text" id="newDesc" placeholder="Any additional details">
          </div>
          <div class="form-field">
            <label>Alert schedule</label>
            <div class="alert-checks">
              <label class="alert-check"><input type="checkbox" id="alert30" checked> 30d</label>
              <label class="alert-check"><input type="checkbox" id="alert14" checked> 14d</label>
              <label class="alert-check"><input type="checkbox" id="alert7" checked> 7d</label>
              <label class="alert-check"><input type="checkbox" id="alert1" checked> 1d</label>
            </div>
          </div>
        </div>
        <button class="add-btn" onclick="addDeadline()" id="addBtn">+ Add Deadline</button>
      </div>

      <div class="section-header">
        <h2 class="section-title">Upcoming Deadlines</h2>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="filterDeadlines('all',this)">All</button>
          <button class="filter-tab" onclick="filterDeadlines('urgent',this)">Urgent</button>
          <button class="filter-tab" onclick="filterDeadlines('tax',this)">Tax</button>
          <button class="filter-tab" onclick="filterDeadlines('privacy',this)">Privacy</button>
          <button class="filter-tab" onclick="filterDeadlines('legal',this)">Legal</button>
        </div>
      </div>
      <div id="deadlines-list"><div class="loading">Loading deadlines...</div></div>
    </div>
  </div>

  <!-- COMPLETED -->
  <div id="section-completed" style="display:none">
    <div class="topbar"><h1 class="page-title">Completed Deadlines</h1></div>
    <div class="content"><div id="completed-list"><div class="loading">Loading...</div></div></div>
  </div>

  <!-- MISSED -->
  <div id="section-missed" style="display:none">
    <div class="topbar"><h1 class="page-title">Missed Deadlines</h1></div>
    <div class="content"><div id="missed-list"><div class="loading">Loading...</div></div></div>
  </div>
</main>
</div>

<div class="toast" id="toast"></div>

<script>
let user = null;
let allDeadlines = [];
let currentFilter = 'all';

(async () => {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) { window.location.href = '/login'; return; }
    user = await res.json();
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('userPlan').textContent = user.plan.charAt(0).toUpperCase() + user.plan.slice(1);
    await loadDeadlines();
    await loadStats();
  } catch { window.location.href = '/login'; }
})();

function showSection(name) {
  ['deadlines','completed','missed'].forEach(s => {
    document.getElementById('section-'+s).style.display = s === name ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', (i===0&&name==='deadlines')||(i===1&&name==='completed')||(i===2&&name==='missed'));
  });
  if (name === 'completed') loadStatusList('completed','completed-list');
  if (name === 'missed') loadStatusList('missed','missed-list');
}

async function loadDeadlines() {
  const res = await fetch('/api/deadlines');
  if (!res.ok) return;
  allDeadlines = await res.json();
  renderDeadlines();
}

async function loadStats() {
  const res = await fetch('/api/deadlines/stats');
  if (!res.ok) return;
  const s = await res.json();
  document.getElementById('stat-total').textContent = s.total;
  document.getElementById('stat-soon').textContent = s.due_soon;
  document.getElementById('stat-month').textContent = s.due_this_month;
  document.getElementById('stat-done').textContent = s.completed;
  document.getElementById('stat-missed').textContent = s.missed;
}

function filterDeadlines(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderDeadlines();
}

function renderDeadlines() {
  const list = document.getElementById('deadlines-list');
  const today = new Date(); today.setHours(0,0,0,0);
  let upcoming = allDeadlines.filter(d => d.status === 'upcoming');
  if (currentFilter === 'urgent') upcoming = upcoming.filter(d => daysUntil(d.due_date) <= 7);
  else if (currentFilter !== 'all') upcoming = upcoming.filter(d => d.category === currentFilter);

  if (!upcoming.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🦉</div><h3>No deadlines yet</h3><p>Add your first compliance deadline above to get started.</p></div>`;
    return;
  }

  list.innerHTML = upcoming.map(d => {
    const days = daysUntil(d.due_date);
    let badgeClass = 'gold', badgeText = `${days} days`;
    let cardClass = '';
    if (days <= 0) { badgeClass='red'; badgeText='Today'; cardClass='urgent'; }
    else if (days === 1) { badgeClass='red'; badgeText='Tomorrow'; cardClass='urgent'; }
    else if (days <= 3) { badgeClass='red'; badgeText=`${days} days`; cardClass='urgent'; }
    else if (days <= 7) { badgeClass='amber'; badgeText=`${days} days`; cardClass='warning'; }
    else if (days <= 14) { badgeClass='amber'; badgeText=`${days} days`; }
    else if (days > 30) { badgeClass='green'; badgeText=`${days} days`; }

    return `
    <div class="deadline-card ${cardClass}">
      <div class="dl-left">
        <div class="dl-title">${escHtml(d.title)}</div>
        <div class="dl-meta">${d.category ? d.category.charAt(0).toUpperCase()+d.category.slice(1)+' · ' : ''}Due ${formatDate(d.due_date)}${d.jurisdiction ? ' · '+escHtml(d.jurisdiction) : ''}</div>
      </div>
      <div class="dl-right">
        <span class="days-badge ${badgeClass}">${badgeText}</span>
        <button class="action-btn success" onclick="markComplete('${d.id}')">Mark done</button>
        <button class="action-btn danger" onclick="deleteDeadline('${d.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

async function loadStatusList(status, containerId) {
  const list = document.getElementById(containerId);
  const items = allDeadlines.filter(d => d.status === status);
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">—</div><h3>No ${status} deadlines</h3><p>${status==='completed'?'Completed deadlines will appear here.':'Missed deadlines will appear here.'}</p></div>`;
    return;
  }
  list.innerHTML = items.map(d => `
    <div class="deadline-card completed">
      <div class="dl-left">
        <div class="dl-title">${escHtml(d.title)}</div>
        <div class="dl-meta">${d.category?d.category.charAt(0).toUpperCase()+d.category.slice(1)+' · ':''} Due ${formatDate(d.due_date)}</div>
      </div>
      <span class="days-badge gray">${status==='completed'?'Completed':'Missed'}</span>
    </div>`).join('');
}

async function addDeadline() {
  const title = document.getElementById('newTitle').value.trim();
  const due_date = document.getElementById('newDate').value;
  const category = document.getElementById('newCategory').value;
  const jurisdiction = document.getElementById('newJurisdiction').value.trim();
  const description = document.getElementById('newDesc').value.trim();
  const alert_30d = document.getElementById('alert30').checked;
  const alert_14d = document.getElementById('alert14').checked;
  const alert_7d = document.getElementById('alert7').checked;
  const alert_1d = document.getElementById('alert1').checked;
  const btn = document.getElementById('addBtn');

  if (!title) { showToast('Please enter a deadline title','error'); return; }
  if (!due_date) { showToast('Please select a due date','error'); return; }

  btn.disabled=true; btn.textContent='Adding...';

  const res = await fetch('/api/deadlines', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({title,due_date,category,jurisdiction,description,alert_30d,alert_14d,alert_7d,alert_1d}),
  });
  const data = await res.json();
  btn.disabled=false; btn.textContent='+ Add Deadline';

  if (!res.ok) { showToast(data.error||'Failed to add deadline','error'); return; }

  document.getElementById('newTitle').value='';
  document.getElementById('newDate').value='';
  document.getElementById('newJurisdiction').value='';
  document.getElementById('newDesc').value='';
  showToast('Deadline added. Alerts scheduled.');
  await loadDeadlines();
  await loadStats();
}

async function markComplete(id) {
  const res = await fetch(`/api/deadlines/${id}`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'completed'})});
  if (res.ok) { showToast('Marked as complete'); await loadDeadlines(); await loadStats(); }
}

async function deleteDeadline(id) {
  if (!confirm('Delete this deadline?')) return;
  const res = await fetch(`/api/deadlines/${id}`, {method:'DELETE'});
  if (res.ok) { showToast('Deadline deleted'); await loadDeadlines(); await loadStats(); }
}

async function logout() {
  await fetch('/api/auth/logout', {method:'POST'});
  window.location.href='/';
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr); due.setHours(0,0,0,0);
  return Math.round((due-today)/(1000*60*60*24));
}

function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>{ t.className='toast'; }, 3000);
}
</script>
</body>
</html>
