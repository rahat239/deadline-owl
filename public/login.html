<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DeadlineOwl</title>
<style>
body{font-family:sans-serif;background:#060610;color:#f0f0f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.card{background:#0e0e1a;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:2.5rem;width:100%;max-width:400px}
h1{font-size:1.8rem;margin-bottom:0.4rem}
p{font-size:0.9rem;color:#7878a0;margin-bottom:2rem}
label{display:block;font-size:0.82rem;margin-bottom:0.4rem;color:#7878a0}
input{width:100%;padding:0.7rem 1rem;background:#161625;border:1px solid rgba(255,255,255,0.13);border-radius:8px;color:#f0f0f8;font-size:0.92rem;outline:none;margin-bottom:1.25rem;box-sizing:border-box}
button{width:100%;padding:0.85rem;background:#7c6cf8;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:0.5rem}
.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:8px;padding:0.75rem;font-size:0.85rem;color:#f87171;margin-bottom:1rem;display:none}
.link{text-align:center;margin-top:1.5rem;font-size:0.88rem;color:#7878a0}
.link a{color:#a89ff8}
</style>
</head>
<body>
<div style="font-size:1.4rem;margin-bottom:2rem">🦉 DeadlineOwl</div>
<div class="card">
  <h1>Welcome back</h1>
  <p>Sign in to your DeadlineOwl account.</p>
  <div class="error" id="err"></div>
  <label>Email</label>
  <input type="email" id="em" placeholder="you@company.com">
  <label>Password</label>
  <input type="password" id="pw" placeholder="••••••••">
  <button id="btn">Sign in →</button>
  <div class="link">No account? <a href="/register">Create one free</a></div>
</div>
<script>
document.getElementById('btn').onclick = async function() {
  var em = document.getElementById('em').value.trim();
  var pw = document.getElementById('pw').value;
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');
  if (!em || !pw) { err.textContent='Fill in all fields'; err.style.display='block'; return; }
  btn.textContent='Signing in…'; btn.disabled=true; err.style.display='none';
  try {
    var r = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    var d = await r.json();
    if (!r.ok) { err.textContent=d.error||'Login failed'; err.style.display='block'; btn.textContent='Sign in →'; btn.disabled=false; return; }
    window.location.href='/dashboard';
  } catch(e) { err.textContent='Network error'; err.style.display='block'; btn.textContent='Sign in →'; btn.disabled=false; }
};
</script>
</body>
</html>
